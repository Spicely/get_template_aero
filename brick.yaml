name: get_template_aero
description: A new brick created with the Mason CLI.

# The following defines the brick repository url.
# Uncomment and update the following line before publishing the brick.
# repository: https://github.com/my_org/my_repo

# The following defines the version and build number for your brick.
# A version number is three numbers separated by dots, like 1.2.34
# followed by an optional build number (separated by a +).
version: 0.1.1+1

# The following defines the environment for the current brick.
# It includes the version of mason that the brick requires.
environment:
  mason: ^0.1.0

# Variables specify dynamic values that your brick depends on.
# Zero or more variables can be specified for a given brick.
# Each variable has:
#  * a type (string, number, boolean, enum, array, or list)
#  * an optional short description
#  * an optional default value
#  * an optional list of default values (array only)
#  * an optional prompt phrase used when asking for the variable
#  * a list of values (enums only)
#  * an optional separator (list only)
vars:
  project_name:
    type: string
    description: The name of your project
    default: dash
    prompt: What is your project name?

  org_name:
      type: string
      description: Your organization name (e.g., com.example)
      default: com.example
      prompt: What is your organization name?

  app_display_name:
    type: string
    description: The application display name
    default: My App
    prompt: What is your app display name?

  flavor_name:
    type: string
    description: The flavor/signing configuration name
    default: zyycomicrach
    prompt: What is the flavor name?

  description_info:
    type: string
    description: A short description for your project
    default: A Flutter project
    prompt: Provide a short description of your project

  channel_android:
    type: string
    description: The Android channel ID
    default: DLXJJL001
    prompt: What is the Android channel ID?

  channel_ios:
    type: string
    description: The iOS channel ID
    default: DNXJ2IOS
    prompt: What is the iOS channel ID?

  id_android:
    type: string
    description: The Android App ID
    default: "45"
    prompt: What is the Android App ID?

  id_ios:
    type: string
    description: The iOS App ID
    default: "46"
    prompt: What is the iOS App ID?
